# Standing Community-independence and private-leakage checks.
# No private checkout, registry login, organization secrets, PATs, or private packages.
name: Community Independence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-independence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source contract and leakage scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go (validator tooling)
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.22"

      - name: Contract tests (no private credentials)
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DOCKER_AUTH_CONFIG: ""
        run: |
          set -euo pipefail
          echo "GH_TOKEN empty=$([ -z \"${GH_TOKEN}\" ] && echo yes || echo no)"
          echo "GITHUB_TOKEN empty=$([ -z \"${GITHUB_TOKEN}\" ] && echo yes || echo no)"
          bash scripts/test-community-independence.sh

      - name: Source/runtime leakage scan
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DOCKER_AUTH_CONFIG: ""
        run: |
          set -euo pipefail
          bash scripts/community-independence/scan.sh --mode source --tag v1.1.0

      - name: Public compose/config independence
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DOCKER_AUTH_CONFIG: ""
        run: |
          set -euo pipefail
          empty_dock="$(mktemp -d)"
          export DOCKER_CONFIG="${empty_dock}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG} (empty)"
          bash scripts/community-independence/scan.sh --mode compose --tag v1.1.0

  public-release-scan:
    name: Public v1.1.0 release leakage scan
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling (no credentials persisted)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Anonymous public v1.1.0 source + SBOM + image scan
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DOCKER_AUTH_CONFIG: ""
        run: |
          set -euo pipefail
          empty_dock="$(mktemp -d)"
          export DOCKER_CONFIG="${empty_dock}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG} (empty)"
          echo "GH_TOKEN empty=$([ -z "${GH_TOKEN}" ] && echo yes || echo no)"
          echo "GITHUB_TOKEN empty=$([ -z "${GITHUB_TOKEN}" ] && echo yes || echo no)"
          out="$(mktemp -d)"
          bash scripts/community-independence/download_public_release.sh \
            --tag v1.1.0 \
            --out-dir "${out}"
          bash scripts/community-independence/scan.sh \
            --mode release-archive \
            --archive "${out}/source.tar.gz"
          bash scripts/community-independence/scan.sh \
            --mode sbom \
            --tag v1.1.0 \
            --sbom-dir "${out}/assets"
          bash scripts/validate-core-manifest.sh \
            --expect-tag v1.1.0 \
            --skip-dockerfile-pins \
            "${out}/assets/core-manifest.yaml"
          bash scripts/community-independence/scan.sh \
            --mode images \
            --manifest "${out}/assets/core-manifest.yaml"
          bash scripts/community-independence/scan.sh \
            --mode compose \
            --tag v1.1.0

      - name: Public Compose smoke (v1.1.0, where feasible)
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DOCKER_AUTH_CONFIG: ""
          IMAGE_TAG: v1.1.0
          KEEP_PUBLIC_STACK_RUNNING: "0"
        run: |
          set -euo pipefail
          empty_dock="$(mktemp -d)"
          export DOCKER_CONFIG="${empty_dock}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG} (empty)"
          # Reuse existing public-stack smoke; do not introduce a mutable latest path.
          bash scripts/validate-public-compose-path.sh v1.1.0
