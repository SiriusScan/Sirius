name: Verify agent dispatch snapshot merge

on:
  push:
    branches: [codex/verify-agent-dispatch-snapshot]

permissions:
  contents: read

jobs:
  inert-ui-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sirius-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de93e431076a280e655d721e565fb00e2f168add
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sirius-ui/package-lock.json
      - name: Check exact candidate
        run: |
          git rev-parse HEAD
          git diff --check 2085c311da9f854e53bfb41912cfc26f00c54613 HEAD
      - run: npm ci
      - name: Inert agent dispatch and scan stop fixtures
        run: |
          npm exec --no -- tsx --test src/server/api/routers/agent-scan-dispatch.test.ts
          npm run test:scanner-cancellation
      - name: Compare UI type diagnostics with the base commit
        run: |
          base_dir="$RUNNER_TEMP/agent-dispatch-base"
          git worktree add --detach "$base_dir" 2085c311da9f854e53bfb41912cfc26f00c54613
          ln -s "$PWD/node_modules" "$base_dir/sirius-ui/node_modules"
          compiler="$PWD/node_modules/.bin/tsc"
          type_check() {
            "$compiler" --noEmit --pretty false --incremental false > "$1" 2>&1 || {
              grep -q 'error TS' "$1" || { cat "$1"; return 1; }
            }
          }
          type_check "$RUNNER_TEMP/candidate.types"
          (cd "$base_dir/sirius-ui" && type_check "$RUNNER_TEMP/base.types")
          diff -u "$RUNNER_TEMP/base.types" "$RUNNER_TEMP/candidate.types"
          echo "UI type diagnostics match the base commit."
