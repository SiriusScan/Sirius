openapi: 3.0.3
info:
  title: Mini breaking fixture
  version: "1.0.0"
paths:
  /api/v1/demo:
    get:
      operationId: getDemo
      # OR: either scheme satisfies (array of requirement objects).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [a, b, c]
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                  values:
                    type: array
                    items:
                      type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: postDemo
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum: [read, write]
              additionalProperties: false
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        nested:
                          type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    DemoResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        values:
          type: array
          items:
            type: string
